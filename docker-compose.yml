# ── Dark Pool Detection — Docker Compose ──────────────────
# Launch: docker compose up -d
# Web UI: http://localhost:5000

version: "3.9"

services:
  darkpool:
    build: .
    container_name: dark-pool-detection
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - TZ=UTC
    volumes:
      # Persistent data
      - ./data:/app/data
      - ./output:/app/output
      # Config overrides
      - ./config/config.default.yaml:/app/config/config.default.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
